<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DELIRIUMC2 // IP Lookup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --bg: #050008;
    --card: #11001c;
    --sidebar: #0a0012;
    --purple: #9d00ff;
    --purple-soft: rgba(157, 0, 255, 0.25);
    --red: #ff003c;
    --text: #ffffff;
    --muted: #9a8fa8;
  }

  * { box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0;
    display: flex;
    min-height: 100vh;
  }

  /* SIDEBAR STYLES */
  .sidebar {
    width: 250px;
    background-color: var(--sidebar);
    border-right: 1px solid var(--purple-soft);
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    position: fixed;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-logo {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-decoration: none;
    color: var(--text);
  }
  .sidebar-logo span { color: var(--purple); }
  .sidebar-logo em { font-style: normal; color: var(--red); }

  .sidebar-menu { list-style: none; padding: 0; margin: 0; }
  .sidebar-menu li { margin-bottom: 10px; }
  .sidebar-menu a {
    color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.9rem;
    display: block; padding: 12px 15px; border-radius: 8px; transition: 0.2s;
    border-left: 3px solid transparent;
  }
  .sidebar-menu a:hover, .sidebar-menu a.active {
    background: rgba(157, 0, 255, 0.1); color: var(--text); border-left-color: var(--purple);
  }
  .dropdown-menu {
    list-style: none; padding: 0; margin: 5px 0 0 15px; display: none;
  }
  .dropdown-menu.active { display: block; }
  .dropdown-menu a { font-size: 0.85rem; padding: 8px 15px; border-left: 2px solid var(--purple-soft); }

  /* MAIN CONTENT */
  .main-content {
    margin-left: 250px; padding: 50px 20px; flex: 1;
    display: flex; flex-direction: column; align-items: center;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(157, 0, 255, 0.10), transparent 30%),
      radial-gradient(circle at 85% 90%, rgba(255, 0, 60, 0.10), transparent 30%);
  }

  .page-title {
    font-size: 2rem; font-weight: 800; margin: 0 0 30px;
    text-align: center; letter-spacing: 3px;
  }
  .page-title span { color: var(--purple); }
  .page-title em { font-style: normal; color: var(--red); }

  /* PINGER STYLES */
  .ping-box {
    background: var(--card); border: 1px solid var(--purple);
    border-radius: 16px; padding: 30px; width: 100%; max-width: 600px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .input-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1; min-width: 200px; background: rgba(0,0,0,0.4); border: 1px solid var(--purple);
    border-radius: 8px; padding: 12px 15px; color: var(--text);
    font-family: 'JetBrains Mono', monospace; outline: none;
  }
  input[type="text"]:focus { border-color: var(--red); }
  
  .btn-start { background: #00ff66; color: #000; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 800; cursor: pointer; transition: 0.2s; }
  .btn-start:hover { background: #00cc52; }
  .btn-stop { background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 800; cursor: pointer; transition: 0.2s; display: none; }
  .btn-stop:hover { background: #cc0030; }

  .terminal {
    background: #000; border: 1px solid #333; border-radius: 8px;
    padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    min-height: 250px; color: #ccc; white-space: pre-wrap; word-break: break-all;
    max-height: 400px; overflow-y: auto;
  }
  .terminal .success { color: #00ff66; }
  .terminal .error { color: var(--red); }
  .terminal .info { color: var(--purple); }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; padding: 20px; border-right: none; border-bottom: 1px solid var(--purple-soft); }
    .main-content { margin-left: 0; padding-top: 30px; }
  }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <a href="index.html" class="sidebar-logo">DELIRIUM<span>C2</span> <em>//</em></a>
    <ul class="sidebar-menu">
      <li><a href="index.html">💰 Pricing Plans</a></li>
      <li>
        <a href="#" onclick="toggleDropdown(event)" class="active">🛠️ Tools ▾</a>
        <ul class="dropdown-menu active" id="toolsDropdown">
          <li><a href="ping.html" class="active">IP Pinger</a></li>
        </ul>
      </li>
      <li><a href="#">📞 Support</a></li>
    </ul>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <h1 class="page-title">DELIRIUM<span>C2</span> <em>//</em> LOOKUP</h1>

    <div class="ping-box">
      <div class="input-group">
        <input type="text" id="ipInput" placeholder="Enter IP or Domain (e.g. 8.8.8.8)">
        <button id="startBtn" class="btn-start" onclick="startPing()">START</button>
        <button id="stopBtn" class="btn-stop" onclick="stopPing()">STOP</button>
      </div>
      
      <div class="terminal" id="terminal">
        > Ready. Enter an IP address or domain and click START.
      </div>
    </div>
  </main>

  <script>
    let pingInterval = null;
    let isPinging = false;

    function toggleDropdown(event) {
      event.preventDefault();
      document.getElementById('toolsDropdown').classList.toggle('active');
    }

    function startPing() {
      const input = document.getElementById('ipInput').value.trim();
      const term = document.getElementById('terminal');
      
      if (!input) {
        term.innerHTML = `<span class="error">> Error: Please enter a valid IP or domain.</span>`;
        return;
      }

      if (isPinging) return;
      isPinging = true;

      // Swap buttons
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
      term.innerHTML = `<span class="info">> Starting continuous ping to ${input}...</span>\n`;

      // Run immediately
      doPing(input);

      // Then run every 3 seconds
      pingInterval = setInterval(() => doPing(input), 3000);
    }

    function stopPing() {
      clearInterval(pingInterval);
      isPinging = false;
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
      
      const term = document.getElementById('terminal');
      term.innerHTML += `\n<span class="error">> Ping stopped by user.</span>\n`;
    }

    async function doPing(input) {
      const term = document.getElementById('terminal');
      const startTime = performance.now();

      try {
        const response = await fetch(`https://ipapi.co/${input}/json/`);
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        
        const data = await response.json();
        const endTime = performance.now();
        const pingTime = Math.round(endTime - startTime);

        if (data.error) {
          term.innerHTML += `<span class="error">> Host not found. (${data.reason})</span>\n`;
          stopPing(); // Stop if the IP is invalid
          return;
        }

        // Print each ping result
        term.innerHTML += `<span class="success">> Reply from ${data.ip}: time=${pingTime}ms</span>\n`;
        
        // Only print the full details once, on the first ping, to avoid spam
        if (term.innerHTML.split('IP Details').length === 1) {
            term.innerHTML += `----------------------------------------\n`;
            term.innerHTML += `<span class="info">> IP Details:</span>\n`;
            term.innerHTML += `  ISP:         ${data.org || 'Unknown'}\n`;
            term.innerHTML += `  Location:    ${data.city || 'Unknown'}, ${data.region || 'Unknown'}, ${data.country_name || 'Unknown'}\n`;
            term.innerHTML += `  Timezone:    ${data.timezone || 'Unknown'}\n`;
            term.innerHTML += `  Coordinates: ${data.latitude}, ${data.longitude}\n`;
            term.innerHTML += `----------------------------------------\n`;
        }

        // Auto-scroll to bottom
        term.scrollTop = term.scrollHeight;

      } catch (error) {
        term.innerHTML += `<span class="error">> Request failed: ${error.message}</span>\n`;
        stopPing();
      }
    }
  </script>

</body>
</html>
