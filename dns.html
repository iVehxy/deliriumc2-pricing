<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap');
  :root { --bg: #050008; --card: #11001c; --sidebar: #0a0012; --purple: #9d00ff; --purple-soft: rgba(157, 0, 255, 0.25); --red: #ff003c; --text: #ffffff; --muted: #9a8fa8; --line: rgba(255, 255, 255, 0.06); }
  * { box-sizing: border-box; }
  body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; min-height: 100vh; }
  .sidebar { width: 250px; background-color: var(--sidebar); border-right: 1px solid var(--purple-soft); padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; }
  .sidebar-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 40px; text-decoration: none; color: var(--text); }
  .sidebar-logo span { color: var(--purple); } .sidebar-logo em { font-style: normal; color: var(--red); }
  .sidebar-menu { list-style: none; padding: 0; margin: 0; } .sidebar-menu li { margin-bottom: 10px; }
  .sidebar-menu a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; display: block; padding: 12px 15px; border-radius: 8px; transition: 0.2s; border-left: 3px solid transparent; }
  .sidebar-menu a:hover, .sidebar-menu a.active { background: rgba(157, 0, 255, 0.1); color: var(--text); border-left-color: var(--purple); }
  .dropdown-menu { list-style: none; padding: 0; margin: 5px 0 0 15px; display: none; } .dropdown-menu.active { display: block; }
  .dropdown-menu a { font-size: 0.85rem; padding: 8px 15px; border-left: 2px solid var(--purple-soft); }
  .main-content { margin-left: 250px; padding: 50px 20px 100px; flex: 1; display: flex; flex-direction: column; align-items: center; background-image: radial-gradient(circle at 15% 10%, rgba(157, 0, 255, 0.10), transparent 30%), radial-gradient(circle at 85% 90%, rgba(255, 0, 60, 0.10), transparent 30%); }
  .page-title { font-size: 2rem; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; text-align: center;} .page-title span { color: var(--purple); text-shadow: 0 0 20px rgba(157,0,255,0.6); }
  .tool-container { width: 100%; max-width: 800px; background: var(--card); border: 1px solid var(--purple-soft); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .form-group { margin-bottom: 20px; } .form-label { display: block; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
  input[type="text"], select { width: 100%; padding: 15px; background: #000; border: 1px solid var(--line); border-radius: 8px; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; outline: none; transition: 0.2s; }
  input[type="text"]:focus, select:focus { border-color: var(--purple); }
  select { cursor: pointer; }
  .btn { background: var(--purple); color: #fff; border: none; border-radius: 8px; padding: 14px 24px; font-weight: 600; cursor: pointer; transition: 0.2s; letter-spacing: 1px; text-transform: uppercase; width: 100%; margin-bottom: 10px; }
  .btn:hover { background: var(--red); }
  .result-box { background: rgba(157,0,255,0.05); border: 1px solid var(--purple-soft); border-radius: 8px; padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; word-break: break-all; margin-top: 10px; color: var(--text); white-space: pre-wrap; }
  .copy-btn { background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 0.75rem; cursor: pointer; letter-spacing: 1px; margin-top: 10px; display: none; }
  .copy-btn:hover { opacity: 0.85; }
  @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; position: relative; padding: 20px; border-right: none; border-bottom: 1px solid var(--purple-soft); } .main-content { margin-left: 0; padding-top: 30px; } }
</style>
</head>
<body>
  <nav class="sidebar">
    <a href="./" class="sidebar-logo">DELIRIUM<span>C2</span> <em>//</em></a>
    <ul class="sidebar-menu">
      <li><a href="./">💰 Pricing Plans</a></li>
      <li>
        <a href="#" onclick="toggleDropdown(event)">🛠️ Tools ▾</a>
        <ul class="dropdown-menu active" id="toolsDropdown">
          <li><a href="ping/">IP Pinger</a></li>
          <li><a href="gradient.html">🎨 Gradient Tool</a></li>
          <li><a href="geo.html">🌍 IP Geolocation</a></li>
          <li><a href="json.html">🧩 JSON Repair</a></li>
          <li><a href="devtools.html">⚙️ Dev Tools</a></li>
          <li><a href="more-tools.html">🚀 More Tools</a></li>
          <li><a href="osint.html">🕵️ OSINT Tools</a></li>
          <li><a href="dns.html" class="active">🔍 DNS Lookup</a></li>
        </ul>
      </li>
      <li><a href="advertise/">📢 Advertise</a></li>
      <li><a href="https://t.me/@vsetls" target="_blank">📞 Support</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <h1 class="page-title">DNS <span>LOOKUP</span></h1>
    <div class="tool-container">
      <div class="form-group">
        <label class="form-label">Domain</label>
        <input type="text" id="domain" placeholder="example.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Record Type</label>
        <select id="type">
          <option value="A">A</option>
          <option value="AAAA">AAAA</option>
          <option value="CNAME">CNAME</option>
          <option value="MX">MX</option>
          <option value="NS">NS</option>
          <option value="TXT">TXT</option>
          <option value="SOA">SOA</option>
          <option value="SRV">SRV</option>
          <option value="ALL">ALL (A + AAAA + MX + NS + TXT)</option>
        </select>
      </div>
      <button class="btn" onclick="lookup()">Lookup</button>
      <div class="result-box" id="output">Results will appear here...</div>
      <button class="copy-btn" id="copyBtn" onclick="copyResult()">COPY</button>
    </div>
  </main>

  <script>
    const TYPE_NAMES = { 1: 'A', 2: 'NS', 5: 'CNAME', 6: 'SOA', 12: 'PTR', 15: 'MX', 16: 'TXT', 28: 'AAAA', 33: 'SRV', 65: 'HTTPS', 257: 'CAA' };
    const STATUS = { 0: 'NOERROR', 1: 'FORMERR', 2: 'SERVFAIL', 3: 'NXDOMAIN', 4: 'NOTIMP', 5: 'REFUSED' };

    function toggleDropdown(event) { event.preventDefault(); document.getElementById('toolsDropdown').classList.toggle('active'); }

    async function resolveOne(domain, type) {
      const r = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=${type}`);
      return r.json();
    }

    async function lookup() {
      const domain = document.getElementById('domain').value.trim();
      const type = document.getElementById('type').value;
      const out = document.getElementById('output');
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.style.display = 'none';
      if (!domain) { out.textContent = 'Enter a domain.'; return; }
      if (!/^[a-zA-Z0-9.-]+$/.test(domain)) { out.textContent = 'Invalid domain format.'; return; }

      out.textContent = 'Resolving...';
      try {
        if (type === 'ALL') {
          const types = ['A', 'AAAA', 'MX', 'NS', 'TXT', 'CNAME'];
          const results = await Promise.all(types.map(t => resolveOne(domain, t)));
          let text = '';
          results.forEach((data, i) => {
            text += `\n== ${types[i]} ==\n`;
            if (data.Status === 0 && data.Answer) {
              text += data.Answer.map(fmt).join('\n');
            } else {
              text += 'No records.';
            }
            text += '\n';
          });
          out.textContent = text.trim();
        } else {
          const data = await resolveOne(domain, type);
          if (data.Status !== 0) {
            out.textContent = `Error: ${STATUS[data.Status] || 'Status ' + data.Status}`;
            return;
          }
          if (!data.Answer) { out.textContent = 'No records found.'; return; }
          out.textContent = data.Answer.map(fmt).join('\n');
        }
        copyBtn.style.display = 'inline-block';
      } catch (e) {
        out.textContent = 'Request failed: ' + e.message;
      }
    }

    function fmt(a) {
      const name = TYPE_NAMES[a.type] || a.type;
      return `${a.name}  ${a.TTL}s  IN  ${name}  ${a.data}`;
    }

    function copyResult() {
      navigator.clipboard.writeText(document.getElementById('output').textContent).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = 'COPIED ✓';
        setTimeout(() => btn.innerText = 'COPY', 1800);
      });
    }

    document.getElementById('domain').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
  </script>
</body>
</html>
